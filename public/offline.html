<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3c49" />
    <title>CareDose is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        background: #f2f8f8;
        color: #0b3c49;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 380px;
        border: 2px solid #cfe0e0;
        border-radius: 20px;
        background: #fff;
        padding: 24px;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 999px;
        background: #ddf0f0;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
        margin: 0 0 12px;
      }
      p {
        font-size: 1rem;
        line-height: 1.55;
        margin: 0 0 16px;
      }
      button {
        min-height: 56px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #0b3c49;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#0B3C49" />
          <g transform="rotate(-45 32 32)">
            <rect x="12" y="22" width="40" height="20" rx="10" fill="#F2F8F8" />
            <path d="M32 22h10a10 10 0 0 1 0 20H32z" fill="#1A8E8E" />
          </g>
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        CareDose needs a connection the first time it opens. Your saved medicines
        and today's plan will still be here when you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
